{% extends "base.html" %}
{% block title %}500 Server Error — FixFlow{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-gutter">
  <div class="text-center max-w-md">
    <span class="material-symbols-outlined text-[72px] text-error mb-4 block">error</span>
    <h1 class="text-display font-bold text-on-surface mb-space-sm">500</h1>
    <h2 class="text-headline-md font-semibold text-on-surface mb-space-md">Internal Server Error</h2>
    <p class="text-body-md text-on-surface-variant mb-space-xl">Something went wrong on our end. Please try again later.</p>
    <a href="{{ url_for('index') }}" class="inline-flex items-center gap-space-xs px-space-lg py-space-sm rounded-lg bg-primary text-on-primary text-label-lg shadow-sm hover:bg-primary-container transition-all">
      <span class="material-symbols-outlined text-[18px]">home</span> Go Home
    </a>
  </div>
</div>
{% endblock %}
